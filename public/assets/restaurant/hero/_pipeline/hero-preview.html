<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Restaurant hero — 72-frame scrub preview</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0a0a0b; color: #e8e6e3; font-family: system-ui, sans-serif; }
    .stage {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }
    .stage img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      display: block;
    }
    .hud {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      padding: 1rem 1.25rem 1.5rem;
      background: linear-gradient(transparent, rgba(0,0,0,.75));
      display: flex;
      flex-direction: column;
      gap: .75rem;
    }
    .row { display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    input[type=range] { flex: 1; min-width: 200px; accent-color: #c9a962; }
    .frame-label { font-variant-numeric: tabular-nums; min-width: 4ch; }
    button {
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.15);
      color: inherit;
      padding: .4rem .75rem;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { background: rgba(255,255,255,.14); }
    kbd { opacity: .7; font-size: .85em; }
  </style>
</head>
<body>
  <div class="stage">
    <img id="frame" alt="" src="../frames/000.webp" />
  </div>
  <div class="hud">
    <div class="row">
      <span class="frame-label" id="num">000</span>
      <input type="range" id="slider" min="0" max="71" value="0" step="1" />
      <button type="button" id="play">Autoplay</button>
    </div>
    <p style="font-size:.8rem;opacity:.75">← → arrow keys · same <code>object-fit: cover</code> as production hero</p>
  </div>
  <script>
    const MAX = 71;
    const img = document.getElementById('frame');
    const slider = document.getElementById('slider');
    const num = document.getElementById('num');
    const playBtn = document.getElementById('play');
    let playing = false;
    let timer = null;

    function pad(n) { return String(n).padStart(3, '0'); }
    function show(i) {
      i = Math.max(0, Math.min(MAX, i));
      slider.value = i;
      num.textContent = pad(i);
      img.src = '../frames/' + pad(i) + '.webp?' + Date.now();
    }

    slider.addEventListener('input', () => show(Number(slider.value)));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') show(Number(slider.value) - 1);
      if (e.key === 'ArrowRight') show(Number(slider.value) + 1);
    });

    playBtn.addEventListener('click', () => {
      playing = !playing;
      playBtn.textContent = playing ? 'Pause' : 'Autoplay';
      if (!playing) { clearInterval(timer); return; }
      timer = setInterval(() => {
        let n = Number(slider.value) + 1;
        if (n > MAX) n = 0;
        show(n);
      }, 1000 / 24);
    });
  </script>
</body>
</html>
